# =============================================================================
# AGENTX R014 - Pytest Configuration
# =============================================================================

[pytest]
# Pytest options

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    # --cov=services --cov=api --cov-report=term-missing

# Asyncio mode (auto-detect async tests)
asyncio_mode = auto

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    websocket: marks tests as WebSocket tests
    requires_ollama: marks tests requiring Ollama
    requires_searxng: marks tests requiring SearXNG

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (when using pytest-cov)
# comment out if pytest-cov is not installed
[coverage:run]
source = services,api
omit =
    */tests/*
    */__init__.py
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
