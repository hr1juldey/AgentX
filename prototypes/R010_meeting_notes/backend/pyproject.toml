[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx-meeting-notes"
version = "0.1.0"
description = "Meeting Notes with VAD and streaming STT"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AgentX Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "torch>=2.0.0",
    "silero>=0.5.2",
    "silero-vad>=5.1.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.28.0", "black>=24.0.0", "ruff>=0.8.0"]

[project.urls]
Homepage = "https://github.com/agentx/meeting-notes"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "models*", "services*", "api*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
