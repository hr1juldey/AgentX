# =============================================================================
# R002 Todo List - Docker Compose
# =============================================================================
# Run both backend and frontend with a single command
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentx-r002-backend
    ports:
      - "8002:8002"
    environment:
      - APP_NAME=Todo List
      - HOST=0.0.0.0
      - PORT=8002
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentx-r002-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8002
      - NEXT_PUBLIC_APP_NAME=Todo List
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev
