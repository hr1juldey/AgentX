# =============================================================================
# R002 Todo List - Backend Python Project
# =============================================================================
# Minimal FastAPI backend for Todo List prototype
# =============================================================================

[project]
name = "agentx-todo-list-backend"
version = "0.1.0"
description = "FastAPI backend for Todo List prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.35",

    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # CORS
    "fastapi-cors>=0.0.6",

    # Async HTTP
    "httpx>=0.27.0",

    # Configuration
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",  # For testing FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]  # Line length handled by formatter
