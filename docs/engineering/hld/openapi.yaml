openapi: 3.0.3
info:
  title: AGENTX API
  description: |
    Local-first AI personal assistant with temporal memory, voice interface, and extensible plugins.

    ## Key Features
    - **Temporal RAG**: Time-aware retrieval with fact invalidation
    - **Voice Interface**: Real-time voice conversation (WebSocket)
    - **Plugin Architecture**: FastMCP-based extensible plugins
    - **Memory System**: Episodic/semantic/procedural memory with consolidation
    - **Privacy**: Local-only processing, PII redaction, GDPR/CCPA compliant

    ## Authentication
    All endpoints require JWT authentication via `Authorization: Bearer <token>` header.

    ## Rate Limiting
    - 100 requests/minute per user
    - 10 concurrent WebSocket connections per user

  version: 1.0.0
  contact:
    name: AGENTX Team
    email: agentx@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: http://192.168.1.4:8000
    description: Local network access

tags:
  - name: Health
    description: System health checks
  - name: Auth
    description: Authentication and user management
  - name: Memory
    description: Memory storage and retrieval
  - name: Chat
    description: Chat interactions with AI assistant
  - name: Plugins
    description: Plugin management and execution
  - name: Voice
    description: Voice interface (WebSocket)
  - name: Admin
    description: Administrative operations

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth/login

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        error_code:
          type: string
          enum: [validation, timeout, quota_exceeded, not_authorized, internal_error]
        retryable:
          type: boolean
          description: Whether the request can be retried
        request_id:
          type: string
          format: uuid
          description: Request identifier for debugging

    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        uptime_seconds:
          type: number
          format: float
        components:
          type: object
          additionalProperties:
            type: string
            enum: [healthy, degraded, unhealthy]

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 8

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Token expiration time in seconds

    MemorySearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 512
          description: Search query
        time_window:
          type: string
          enum: [recent_30d, recent_90d, all, custom]
          default: all
          description: Time window for retrieval
        custom_start:
          type: string
          format: date-time
          description: Custom start date (required for custom time_window)
        custom_end:
          type: string
          format: date-time
          description: Custom end date (required for custom time_window)
        freshness_hint:
          type: string
          enum: [prefer_recent, prefer_comprehensive, balanced]
          default: balanced
          description: Freshness preference for results
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 50
          default: 10

    SearchResult:
      type: object
      required:
        - id
        - text
        - score
        - provenance
        - confidence
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 2000
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Similarity score (0-1)
        provenance:
          type: object
          required:
            - created_at
            - source
            - version_id
          properties:
            created_at:
              type: string
              format: date-time
            source:
              type: string
              enum: [user_input, plugin_ingest, system_inferred]
            version_id:
              type: string
              description: Schema version when created
        confidence:
          type: string
          enum: [high, medium, low]
        redacted:
          type: boolean
          description: Whether PII was redacted

    MemorySearchResponse:
      type: object
      required:
        - results
        - total_count
        - retrieval_time_ms
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        total_count:
          type: integer
          minimum: 0
        retrieval_time_ms:
          type: integer
          description: Retrieval time in milliseconds

    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: User message
        conversation_id:
          type: string
          format: uuid
          description: Conversation ID for context
        mode:
          type: string
          enum: [text, voice]
          default: text
          description: Interaction mode

    ChatResponse:
      type: object
      required:
        - response
      properties:
        response:
          type: string
          description: AI response
        sources:
          type: array
          items:
            type: string
          format: uuid
          description: Memory IDs used as context
        tool_calls:
          type: array
          items:
            type: object
            required:
              - tool
              - status
            properties:
              tool:
                type: string
              status:
                type: string
                enum: [success, failure, skipped]
              result:
                type: string
          description: Tools called during processing
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        latency_ms:
          type: integer
          description: Total processing time in milliseconds

    PluginManifest:
      type: object
      required:
        - name
        - version
        - type
        - capabilities
        - required_permissions
      properties:
        name:
          type: string
        version:
          type: string
          format: semver
        type:
          type: string
          enum: [automation, extension, experimental]
        capabilities:
          type: array
          items:
            type: string
        required_permissions:
          type: array
          items:
            type: object
            required:
              - resource
              - operations
              - scope
            properties:
              resource:
                type: string
                enum: [memory, voice, search, mis, filesystem]
              operations:
                type: array
                items:
                  type: string
                  enum: [read, write, delete]
              scope:
                type: string
                enum: [own, shared, all]
        resource_quotas:
          type: object
          properties:
            cpu_percent:
              type: number
              maximum: 100
            ram_mb:
              type: integer
              maximum: 1024
            timeout_seconds:
              type: integer
              maximum: 300
        data_scope:
          type: string
          enum: [none, user_preferences, user_data, system]
        retention_policy:
          type: string
          enum: [none, session, 30d, 90d, forever]

    PluginListResponse:
      type: object
      required:
        - plugins
      properties:
        plugins:
          type: array
          items:
            type: object
            required:
              - name
              - version
              - type
              - enabled
            properties:
              name:
                type: string
              version:
                type: string
              type:
                type: string
                enum: [automation, extension, experimental]
              enabled:
                type: boolean
              health:
                type: string
                enum: [healthy, unhealthy, unknown]

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns system health status
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticate user and receive JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Invalidate current session
      responses:
        '200':
          description: Logout successful
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/memory/search:
    post:
      tags: [Memory]
      summary: Search memory
      description: Temporal-aware memory search with fact invalidation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
      responses:
        '200':
          description: Search successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/memory/export:
    get:
      tags: [Memory]
      summary: Export all user data
      description: Export all user data in JSON format (GDPR/CCPA right to access/portability)
      responses:
        '200':
          description: Data export successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - user_id
                  - export_date
                  - memories
                properties:
                  user_id:
                    type: string
                    format: uuid
                  export_date:
                    type: string
                    format: date-time
                  memories:
                    type: array
                    items:
                      type: object
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/memory/forget-me:
    post:
      tags: [Memory]
      summary: Delete all user data
      description: Delete all user data (GDPR/CCPA right to erasure)
      responses:
        '200':
          description: All data deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                  - memory_count
                properties:
                  deleted:
                    type: boolean
                  memory_count:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/chat:
    post:
      tags: [Chat]
      summary: Send chat message
      description: Send message to AI assistant with optional conversation context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plugins:
    get:
      tags: [Plugins]
      summary: List plugins
      description: List all installed plugins with status
      responses:
        '200':
          description: Plugin list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plugins/{plugin_name}/enable:
    post:
      tags: [Plugins]
      summary: Enable plugin
      description: Enable a previously installed plugin
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin enabled
        '404':
          description: Plugin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Plugin conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plugins/{plugin_name}/disable:
    post:
      tags: [Plugins]
      summary: Disable plugin
      description: Disable an active plugin
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin disabled
        '404':
          description: Plugin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plugins/{plugin_name}/tools/{tool_name}:
    post:
      tags: [Plugins]
      summary: Execute plugin tool
      description: Execute a specific tool from a plugin
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Tool execution successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                  metadata:
                    type: object
                    properties:
                      execution_time_ms:
                        type: integer
                      cache_hit:
                        type: boolean
        '404':
          description: Plugin or tool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Tool execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ws/voice:
    get:
      tags: [Voice]
      summary: Voice WebSocket
      description: |
        Real-time bidirectional voice conversation.

        See [kyutai_speech_integration_plan.md](kyutai_speech_integration_plan.md) for full protocol details.
      responses:
        '101':
          description: WebSocket connection established
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid

  /api/admin/consolidate:
    post:
      tags: [Admin]
      summary: Trigger memory consolidation
      description: Manually trigger memory consolidation process
      responses:
        '200':
          description: Consolidation triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  estimated_completion:
                    type: string
                    format: date-time
        '401':
          description: Not authorized (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/backup:
    post:
      tags: [Admin]
      summary: Create backup
      description: Create system backup (Qdrant snapshots, Mem0AI export)
      responses:
        '200':
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_id:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
        '401':
          description: Not authorized (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

---
**This OpenAPI specification is part of AGENTX HLD v1.0. See [HLD.md](HLD.md) for complete architecture.**
