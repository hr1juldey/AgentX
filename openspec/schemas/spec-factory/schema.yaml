name: spec-factory
version: 1
description: |
  Automated spec generation schema that synthesizes LLD documents and
  explores codebase to produce comprehensive OpenSpec specifications.
  Uses a 7-artifact pipeline: scan → extract → validate → proposal → specs → design → tasks
artifacts:
  - id: scan
    generates: scan.md
    description: Synthesize LLD documents and run opsx:explore to generate file inventory and discover patterns
    template: scan.md
    instruction: |
      Create the scan artifact by synthesizing LLD documents and orchestrating opsx:explore.

      Steps:
      1. Read relevant LLD documents (domain_model.md, agent_runtime.md, incremental_release_plan.md)
      2. Extract locked definitions (entities, enums, signatures, repositories)
      3. Run opsx:explore with forced topics and absolute paths
      4. Generate file inventory with line counts and purposes
      5. Catalog discovered patterns (architectural, code, anti-patterns)
      6. Document key files for this specific change
    requires: []
  - id: extract
    generates: extract.md
    description: Categorize discovered patterns and generate specification drafts
    template: extract.md
    instruction: |
      Create the extract artifact by categorizing patterns and generating specification drafts.

      Sections:
      1. Pattern Catalog: Architectural patterns, code structure patterns, naming patterns to avoid
      2. Specification Drafts: Domain-specific spec drafts with LLD alignment
      3. API Contracts: REST endpoints, WebSocket channels, port assignments
      4. Data Model Mappings: Pydantic → Zod type synchronization
      5. Dependencies on other specs
    requires:
      - scan
  - id: validate
    generates: validate.md
    description: Validate outputs against CLAUDE_POLICY.md and check spec quality
    template: validate.md
    instruction: |
      Create the validate artifact by checking all outputs against policy and quality standards.

      Validation checks:
      1. CLAUDE_POLICY.md compliance: imports, Ruff, file sizes, anti-patterns
      2. Spec quality: completeness, clarity, feasibility
      3. LLD alignment: locked definitions match exactly
      4. Required fixes: critical and optional improvements
    requires:
      - extract
  - id: proposal
    generates: proposal.md
    description: Standard OpenSpec proposal document defining scope, motivation, and success criteria
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Summary**: 2-3 sentence description
      - **Motivation**: Problem statement, current state, desired state
      - **Scope**: In scope, out of scope, dependencies
      - **Success Criteria**: Measurable criteria with targets
      - **Implementation Approach**: High-level strategy, key decisions, constraints
      - **Risks and Mitigations**: Risk assessment with mitigation strategies
      - **Open Questions**: Outstanding items to resolve
    requires:
      - validate
  - id: specs
    generates: specs/**/*.md
    description: Detailed domain-specific specifications extracted from patterns
    template: specs.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Generate specs/{domain}/spec.md for each capability area.
      Include: functional requirements, non-functional requirements, data models,
      API contracts, business rules, acceptance criteria.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with architecture diagrams, tradeoff analysis, and implementation decisions
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      Sections:
      - **Architecture**: Component diagrams, layer structure
      - **Data Flow**: Request flow, event flow
      - **Technical Decisions**: Options chosen with rationale
      - **Tradeoff Analysis**: Alternative approaches with comparison
      - **Implementation Details**: Key classes, ports, storage schema
      - **Security/Performance Considerations**: Mitigation strategies
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation task checklist with verification steps and acceptance criteria
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Group tasks by phase (Foundation, Integration, Frontend, Testing).
      Include verification steps: code quality, file size check, import check, type check.
      Define acceptance criteria and definition of done.
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
