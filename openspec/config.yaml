schema: spec-factory

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: Python 3.12, FastAPI, DSPy 3.1+, LangGraph, Ollama, Mem0AI
  Architecture: Clean Architecture (4-layer: Presentation, Application, Domain, Infrastructure)
  Backend: Pydantic, uvicorn, asyncio
  Frontend: Next.js, React, Tailwind CSS, shadcn/ui
  Code quality: Ruff (linter/format), Pyrefly (type checking), 100 lines/file max
  Domain: AI personal assistant with voice, memory, and generative UI

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
    - Include verification steps (ruff, pyrefly)
  all:
    - Follow CLAUDE_POLICY.md strictly:
      - ABSOLUTE IMPORTS ONLY: No `from .` or `from ..` allowed
      - Ruff compliance: Must pass `ruff check --fix` and `ruff format`
      - File size: Max 100 lines executable code, 50 lines overhead
      - No anti-patterns: No god objects, magic numbers, circular imports
